<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gitarren-Notentrainer Pro (Bund 0 - 15)</title>

  <!-- Modulare Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/notation.css">
  <link rel="stylesheet" href="css/fretboard.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

  <header>
    <h1>🎸 Gitarren-Notentrainer Pro</h1>
    <div class="subtitle">Interaktives Notenlernen & Rhythmustraining mit Mikrofon oder iRig HD 2</div>
  </header>

  <main class="main-container">

    <!-- Haupt-Bedienfeld -->
    <section class="controls-panel">
      <!-- Reihe 1: Modus, Songauswahl, Tempo / BPM -->
      <div class="controls-row">
        <div class="control-group">
          <label for="mode-select">Modus:</label>
          <select id="mode-select">
            <option value="practice" selected>🎯 Üben (Wartet auf Note)</option>
            <option value="rhythm">⏱ Rhythmus (BPM-Timing)</option>
            <option value="endless">∞ Endlos-Training</option>
            <option value="editor">✏️ Song-Editor</option>
          </select>
        </div>

        <div class="control-group" id="song-select-group">
          <label for="song-select">Lied:</label>
          <select id="song-select"></select>
          <label class="btn" style="cursor:pointer; padding: 5px 10px; font-size: 0.82rem;" title="Song- (.json) oder MIDI-Datei (.mid) öffnen">
            📂 Datei öffnen
            <input type="file" id="main-file-input" accept=".json,.mid,.midi,.MID,.MIDI" style="display:none;">
          </label>
        </div>

        <div class="control-group" id="bpm-group" style="display: none;">
          <button id="rhythm-start-btn" class="btn btn-success" style="padding: 5px 14px; font-weight: 700;" title="Rhythmus-Lauf starten oder stoppen (Leertaste)">
            ▶ Start
          </button>
          <label for="bpm-slider">Tempo:</label>
          <input type="range" id="bpm-slider" min="40" max="180" step="2" value="100">
          <span id="bpm-val" class="bpm-badge">100 BPM</span>
          <label class="toggle-label" title="Akustischen Klickton für Taktschläge abspielen">
            <input type="checkbox" id="metronome-toggle" checked>
            <span>Metronom</span>
          </label>
        </div>

        <div class="control-group" id="speed-group" style="display: none;">
          <label for="speed-slider">Tempo:</label>
          <input type="range" id="speed-slider" min="0.5" max="3.0" step="0.1" value="1.2">
          <span id="speed-val" class="bpm-badge">1.2x</span>
        </div>

        <div class="control-group">
          <button id="fretboard-toggle-btn" class="btn" title="Griffbrett ein- oder ausblenden (Konzentration auf das reine Notenlesen)">
            🎸 Griffbrett: An
          </button>
        </div>
      </div>

      <!-- Reihe 2: Status, Pegel-Meter, Audio-Verbindung -->
      <div class="controls-row">
        <div class="control-group">
          <span style="color:var(--text-muted); font-size:0.85rem;">Status / Punkte:</span>
          <span id="score" class="status-badge">0 / 0</span>
        </div>

        <div class="control-group">
          <div class="detected-note-box">
            <span style="color:var(--text-muted); font-size:0.8rem;">Gespielt:</span>
            <span id="pitch-display" class="detected-note-value">--</span>
          </div>
        </div>

        <!-- Audio Input & Pegel-Meter -->
        <div class="audio-section">
          <div class="level-meter-container" title="Eingangspegel (Lautstärke)">
            <span class="level-meter-label">Pegel</span>
            <div class="level-meter-bar">
              <div id="level-meter-fill" class="level-meter-fill"></div>
            </div>
          </div>

          <button id="irig-btn" class="audio-btn btn-irig" title="Direkter Gitarreneingang für Audio-Interfaces">
            iRig HD 2 verbinden
          </button>
          <button id="mic-btn" class="audio-btn btn-mic" title="Akustische Gitarre über internes Laptop-Mikrofon">
            Laptop-Mikrofon
          </button>
        </div>
      </div>
    </section>

    <!-- Song-Editor Bedienfeld (wird nur im Editor-Modus eingeblendet) -->
    <section id="editor-panel" class="editor-panel" style="display: none;"></section>

    <!-- Notensystem-Darstellung (Canvas) -->
    <section class="notation-card">
      <canvas id="notation-canvas" width="940" height="190"></canvas>
      <div class="notation-overlay">Violinschlüssel (Gitarren-Transposition)</div>
    </section>

    <!-- Griffbrett-Darstellung (Bund 0 bis 15) -->
    <section class="fretboard-card" id="fretboard-card">
      <div class="fretboard" id="fretboard"></div>
    </section>

  </main>

  <!-- Ergebnis- & Auswertungs-Modal nach Liedende -->
  <div id="eval-modal" class="modal-backdrop">
    <div class="modal-content">
      <h2 class="modal-title">🎉 Lied beendet!</h2>
      <div class="score-circle">
        <div id="modal-score-percent" class="score-percent">100%</div>
        <div class="score-grade">Genauigkeit</div>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <span id="modal-stat-hits" class="stat-num" style="color:var(--accent-green);">0</span>
          <span class="stat-label">Treffer</span>
        </div>
        <div class="stat-item">
          <span id="modal-stat-misses" class="stat-num" style="color:var(--accent-red);">0</span>
          <span class="stat-label">Verpasst / Falsch</span>
        </div>
        <div class="stat-item" style="grid-column: span 2;">
          <span id="modal-stat-streak" class="stat-num" style="color:var(--accent-blue);">0</span>
          <span class="stat-label">Längste Trefferserie (Streak)</span>
        </div>
      </div>

      <div class="modal-actions">
        <button id="modal-restart-btn" class="btn btn-primary">Erneut spielen</button>
        <button id="modal-close-btn" class="btn">Schließen</button>
      </div>
    </div>
  </div>

  <!-- App Hauptskript als ES-Modul -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
