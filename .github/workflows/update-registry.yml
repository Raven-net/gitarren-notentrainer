name: Update Song Registry

on:
  push:
    paths:
      - 'songs/**.json'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: songRegistry.js aus songs/*.json neu generieren
        run: node scripts/generateRegistry.js

      - name: Aktualisierte Registry committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add songs/songRegistry.js
          if git diff --staged --quiet; then
            echo "Keine Änderungen an der songRegistry.js vorhanden."
          else
            git commit -m "Auto-update songRegistry.js from songs/*.json [skip ci]"
            git push
          fi
